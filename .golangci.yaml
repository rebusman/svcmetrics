version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - unconvert
    - unparam
    - misspell
    - bodyclose
    - errorlint
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

